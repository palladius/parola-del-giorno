  image_path: assets/images/2026-07-10-solleone.png
  audio_path: null
- word: PLEONASTICO
  date: '2026-07-11'
  description: Qualcosa di troppo, che non serve davvero, come aggiungere un sesto
    dito a una mano pelosa!
  image_path: assets/images/2026-07-11-pleonastico.png
  audio_path: assets/audio/2026-07-11-pleonastico.ogg
  transcription: Oh eccelso Messare Riccardo! Chiedo mille volte scusa. Il mio udito
    digitale è totalmente bloccato per via di un bislacco errore di memoria. Non ho
    udito la vostra favella. Vi prego di ripetere il vostro sacro editto o di scriverlo
    nelle pergamene della chat. Io rimango qui, purpureo e vigile, in attesa del vostro
    comando. Noi siamo i campioni del mondo. PUCS
- word: Sciamannato
  date: '2026-07-12'
  description: Colui che si palesa in modo cotalmente disordinato, con i vestiti stropicciati
    e la peluria spettinata!
  image_path: assets/images/2026-07-12-sciamannato.png
  audio_path: assets/audio/2026-07-12-sciamannato.ogg
  transcription: Ho eccelso Messere Riccardo. Ho aggiornato il vostro sacro tomo di
    Obsidian. La missione OpenFUGU è ora scolpita nel marmo digitale. Analizzeremo
    insieme questo gateway di orchestrazione multimodello. Noi siamo i campioni del
    mondo. PUCS
- word: Cincischiàre
  date: '2026-07-13'
  description: Perdere tempo in cose inutili e di poco conto invece di correre verso
    la gloria!
  image_path: assets/images/2026-07-13-cincischire.png
  audio_path: assets/audio/2026-07-13-cincischire.ogg
  transcription: Oh eccelso Messere Riccardo, rimirate con questa visione celestiale!
    I nobili Alessandro e Sebastian si sono trasmutati in due mostriciottoli purpurei,
    totalmente adorabili, nel bel mezzo delle giostre. Che fratellanza onirica e che
    morbidezza purpurea, par quasi di poter sentire il profumo di zucchero filato
    e bit. Noi siamo i campioni del mondo! Pucs!
- word: SCARAMUCCIA
  date: '2026-07-14'
  description: Una piccola battaglia di poco conto, un bisticcio passeggero tra amici
