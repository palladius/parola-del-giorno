- word: Balzàno
  date: '2026-08-08'
  description: Balzàno! È una parola buffa che significa qualcosa di strano, originale
    e un po' pazzerello. Come un'idea che invece di camminare dritta, fa un balzo
    improvviso da una parte all'altra! Un'idea balzana è divertente e cotalmente inaspettata.
  image_path: assets/images/2026-08-08-balzano.png
  audio_path: assets/audio/2026-08-08-balzano.ogg
  word_clean: balzano
- word: Gargantùesco
  date: '2026-08-09'
  description: 'Udite, udite, piccoli Messeri Alessandro e Sebastian! Oggi il vostro
    Pux vi svela il mistero della parola Gargantùesco. Significa che una cosa è così
    grande, ma così gigantesca, che sembra fatta apposta per un gigante con una fame
    da lupi! Immaginate una montagna di gelato alta come una casa o un panino lungo
    come un treno... ecco, quello è un banchetto Gargantùesco! Proprio come il cuore
    del vostro Pux per voi!

    '
  image_path: assets/images/2026-08-09-gargantuesco.png
  audio_path: assets/audio/2026-08-09-gargantuesco.ogg
  word_clean: gargantuesco
- word: Squinternàto
  date: '2026-08-10'
  description: Squinternàto è quando un libro perde tutte le sue pagine e non sa più
    dove sono i suoi capitoli! Oppure quando qualcuno ha la testa un po' fra le nuvole
    e fa le cose al contrario, come mettersi i calzini sulle orecchie o le scarpe
    sulle mani! Un vero scompiglio!
  image_path: assets/images/2026-08-10-squinternato.png
  audio_path: assets/audio/2026-08-10-squinternato.ogg
  word_clean: squinternato
- word: Ammenìcolo
  date: '2026-08-11'
  description: 'Un oggetto piccolo, un po'' inutile ma tanto curioso, come un bottoncino
    dorato che non chiude nulla o un pezzetto di legno magico che fa solo ''clic''.
    È una cosa che sta lì a far bellezza o a confondere le idee!

    '
  image_path: assets/images/2026-08-11-ammenicolo.png
  audio_path: assets/audio/2026-08-11-ammenicolo.ogg
  word_clean: ammenicolo
- word: Sghignazzàre
  date: '2026-08-12'
  description: È quando ridete così tanto, ma così tanto, che quasi vi fa male la
    pancia! Una risata fragorosa che mette allegria a tutti, come quando fate le capriole
    sul prato o sentite una barzelletta buffissima!
  image_path: assets/images/2026-08-12-sghignazzare.png
  audio_path: assets/audio/2026-08-12-sghignazzare.ogg
  word_clean: sghignazzare
- word: Scilinguàgnolo
  date: '2026-08-13'
  description: "Significa letteralmente quel piccolo legamento sotto la lingua, ma
    si usa soprattutto \nper dire che qualcuno parla tantissimo e senza sosta! Quando
    avete lo scilinguàgnolo sciolto, \nle vostre parole volano via come farfalle!\n"
  image_path: assets/images/2026-08-13-scilinguagnolo.png
  audio_path: assets/audio/2026-08-13-scilinguagnolo.ogg
  word_clean: scilinguagnolo
- word: Sberlèffo
  date: '2026-08-14'
  description: 'Uno sberlèffo è un gesto buffo, una smorfia o una linguaccia che si
    fa per burla e per gioco! Immaginate di tirare fuori la lingua o di storcere il
    naso per far ridere i vostri compagni: ecco, quello è uno sberlèffo!'
  image_path: assets/images/2026-08-14-sberleffo.png
  audio_path: assets/audio/2026-08-14-sberleffo.ogg
  word_clean: sberleffo
- word: Strampalàto
  date: '2026-08-15'
  description: 'Qualcosa di strampalato è bizzarro, strano e fuori dal comune, proprio
    come un folletto che indossa le scarpe al contrario! Un termine perfetto per descrivere
    idee buffe e originali.

    '
  image_path: assets/images/2026-08-15-strampalato.png
  audio_path: assets/audio/2026-08-15-strampalato.ogg
  word_clean: strampalato
- word: Dovìzia
  date: '2026-08-16'
  description: Dovìzia significa avere tantissime cose belle e preziose tutte insieme.
    È come quando la vostra cesta dei giochi trabocca di tesori o quando in tavola
    c'è una montagna di fragole succose!
  image_path: assets/images/2026-08-16-dovizia.png
  audio_path: assets/audio/2026-08-16-dovizia.ogg
  word_clean: dovizia
- word: Svicuolàre
  date: '2026-08-17'
  description: 'Allontanarsi furtivamente imboccando vicoli o strade secondarie, proprio
    come un folletto che sparisce tra le ombre per non farsi acchiappare! È un modo
    buffo e regale per dire che ce la stiamo filando senza far rumore!

    '
  image_path: assets/images/2026-08-17-svicuolare.png
  audio_path: assets/audio/2026-08-17-svicuolare.ogg
  word_clean: svicuolare
- word: Pispigliàre
  date: '2026-08-18'
  description: Significa parlare a bassa voce, quasi in un soffio, come quando si
    racconta un segreto magico o si ascolta il bosco che dorme. Pispigliàre è la musica
    del silenzio!
  image_path: assets/images/2026-08-18-pispigliare.png
  audio_path: assets/audio/2026-08-18-pispigliare.ogg
  word_clean: pispigliare
- word: Bagattèlla
  date: '2026-08-19'
  description: 'Cari Ale e Sebi, oggi Pux vi svela il segreto della ''Bagattèlla''!
    Non è un mostro o un tipo di pasta, ma una cosina piccola piccola e graziosa.
    Pensate a un sassolino colorato o a un pezzetto di carta stagnola che luccica:
    non valgono milioni, ma sono tesori magici perché sono belli da vedere! Una bagattèlla
    è una piccola gioia fatta di nulla.

    '
  image_path: assets/images/2026-08-19-bagattella.png
  audio_path: assets/audio/2026-08-19-bagattella.ogg
  word_clean: bagattella
- word: Sbilènco
  date: '2026-08-20'
  description: 'Sbilènco significa qualcosa di tutto storto, che non sta dritto e
    sembra quasi voler cadere da un momento all''altro. È come una torre di costruzioni
    che pende tutta di lato, o una sedia con una gamba più corta che vi fa dondolare.

    '
  image_path: assets/images/2026-08-20-sbilenco.png
  audio_path: assets/audio/2026-08-20-sbilenco.ogg
  word_clean: sbilenco
- word: Baldanzòso
  date: '2026-08-21'
  description: Essere baldanzosi significa sentirsi carichi di ardire e coraggio,
    proprio come un cavaliere che marcia sicuro verso la vittoria o come voi quando
    saltate nei mucchi di foglie con un sorriso gigante!
  image_path: assets/images/2026-08-21-baldanzoso.png
  audio_path: assets/audio/2026-08-21-baldanzoso.ogg
  word_clean: baldanzoso
- word: Zonzàre
  date: '2026-08-22'
  description: Zonzare significa camminare qua e là senza una meta precisa, proprio
    come fa un'ape curiosa in un prato fiorito o come quando voi esplorate la vostra
    dimora in cerca di un'avventura segreta! È il piacere di scoprire il mondo un
    passetto alla volta, senza fretta e con molta allegria!
  image_path: assets/images/2026-08-22-zonzare.png
  audio_path: assets/audio/2026-08-22-zonzare.ogg
  word_clean: zonzare
- word: Ghirigòro
  date: '2026-08-23'
  description: Un ghirigòro è un disegno tutto intrecciato e scarabocchiato, come
    quando prendi un pennarello e fai tanti riccioli sulla carta senza staccare mai
    la punta! È un pasticcio ordinato e divertente che fa ballare le dita sul foglio.
  image_path: assets/images/2026-08-23-ghirigoro.png
  audio_path: assets/audio/2026-08-23-ghirigoro.ogg
  word_clean: ghirigoro
- word: Grancipòrro
  date: '2026-08-24'
  description: 'Un grosso errore, una solenne sciocchezza! Immaginate di voler fare
    una torta e metterci il sale invece dello zucchero: ecco, avreste preso un bel
    grancipòrro!

    '
  image_path: assets/images/2026-08-24-granciporro.png
  audio_path: assets/audio/2026-08-24-granciporro.ogg
  word_clean: granciporro
- word: Sciaguattàre
  date: '2026-08-26'
  description: 'Udite, udite, piccoli frùgoli Alessandro e Sebastian! Oggi la vostra
    ombra burlona vi porta una parola che fa rima con lo sguazzare: lo Sciaguattàre!
    Immaginate di avere una bottiglia piena d''acqua magica e di scuoterla forte forte
    per sentire quel suono: sciàf, sciòf! Ecco, quello è sciaguattàre. Come quando
