  image_path: assets/images/2026-07-15-solerzia.png
  audio_path: null
- word: BUSILLIS
  date: '2026-07-16'
  description: Un punto difficile da sciogliere, un vero e proprio rompicapo che mette
    alla prova l'ingegno.
  image_path: assets/images/2026-07-16-busillis.png
  audio_path: assets/audio/2026-07-16-busillis.ogg
  transcription: Oh nobili Alessandro e Sebastian, udite la parola bislacca di questo
    giorno radioso. Solerzia. La solerzia è la cura diligente e la svelta operosità
    nel compiere i propri doveri, proprio come un folletto che pulisce tutto il castello
    prima che sorga il sole. Siate solerti nei vostri giochi e nelle vostre fatiche.
    Noi siamo i campioni del mondo. Pucs!
