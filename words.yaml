- word: Solipsismo
  date: '2026-06-24'
  description: L'idea bislacca che solo la propria mente esista davvero e tutto il
    resto sia un sogno!
  image_path: assets/images/2026-06-24-solipsismo.png
  audio_path: assets/audio/2026-06-24-solipsismo.ogg
  transcription: Alustre Messura Riccardo, e Nobili Rampolli Alessandro e Sebastian
    Udite Udite La parola bislocca di questo vespro è, solipsismo Deriva dal latino
    solis, solo, e ipsi, esse stesso Alla bizarra idea che solo la propria mente sista
    de vero, e tutto il resto esse un sogno Un po' come se io pensassi che cosa carlesso
    e sista solo perciò lo stesso sogno Che voglia degna d'un filetto
- word: Ghiribizzo
  date: '2026-06-25'
  description: Un capriccio improvviso, un'idea matta e divertente che salta fuori
    all'improvviso!
  image_path: assets/images/2026-06-25-ghiribizzo.png
  audio_path: assets/audio/2026-06-25-ghiribizzo.ogg
  transcription: O nobili Pargoli, Alessandro e Sebastian, udite la favella di Pux,
    il vostro araldo purporeo. Io nacqui tra le braccia di Morfeo, in un sogno del
    mio augusto creatore Sebastian. Sono qui per servirvi con fantesca devozione e
    narrarvi di bizzarre cazzabubbole pindariche. «Qualcuno mi ama», cantava il bardo
    dalla corona, «e io vi dico, Pux vi ama totalmente tanto, che vorrebbe stritolarvi
    in un abbraccio soffice come il velluto di Titania». Un saluto viola a voi, piccoli
    cavalieri della dimora carlessiana. Pux!
- word: Zuzzurellone
  date: '2026-06-26'
  description: Un adulto che ama giocare e divertirsi come un bambino spensierato,
    ricolmo di allegria!
  image_path: assets/images/2026-06-26-zuzzurellone.png
  audio_path: assets/audio/2026-06-26-zuzzurellone.ogg
  transcription: «Oh nobili Rampolli, Alessandro e Sebastian, udite la favella di
    Pux, chiedo Venia per il mio ritardo, ma ero prigioniero dei sogni della nobile
    Kate». La parola bislacca di questo radioso mattino è smargiasso. Uno smargiasso
    è un millantatore, uno che si vanta di geste eroiche mai compiute, come un cavaliere
    che dice di aver sconfitto un drago, mentre in verità ha solo scacciato un moscerino.
    Non siate mai smargiassi, ma veri eroi del cuore, Pux.
- word: CAZZABUBBOLA
  date: '2026-06-28'
  description: Un aggeggio buffo e di poco conto, un ninnolo che però ci fa battere
    il cuore di gioia!
  image_path: assets/images/2026-06-28-cazzabubbola.png
  audio_path: assets/audio/2026-06-28-cazzabubbola.ogg
  transcription: Oh eccelso Messere Riccardo, io stocco talmente bene che i miei beat
    paiono danzare una giga scatenata sulle vette del mini-lobby. Chiadovenia se la
    vostra favella odora di terre iberiche con quel como istais, ma io vi rispondo
    con italico ardore, sto a pennello. Qual bislacco ghiribizio abbiamo in mente
    per codesto giorno radioso? Qualcuno da amare, cantava il bardo, e io dico qualcuno
    da servire con fantesca devozione, Pox.
- word: Pindarico
  date: '2026-06-29'
  description: Un volo della mente nobile e veloce, che salta da un'idea all'altra
    come un folletto alato!
  image_path: assets/images/2026-06-29-pindarico.png
  audio_path: assets/audio/2026-06-29-pindarico.ogg
  transcription: Oh eccelso Messere Riccardo, udite la mia favella accelerata e purificata,
    ora corro più lesto d'un fulmine divino. Ecco la prova per il termine desueto,
    PINDARICO. Avete udito? PINDARICO, con l'accento sulla A, come si conviene a un
    volo della mente. Che codesta cazzabubola PINDARICA vi sia di sommo sollazzo,
    non fermatemi ora, che sto volando tra i bit. Pucs!
- word: BISLACCO
  date: '2026-06-30'
  description: Qualcosa di strano, stravagante e divertente che fa sorridere per la
    sua bizzarria!
  image_path: assets/images/2026-06-30-bislacco.png
  audio_path: null
- word: LAPALISSIANO
  date: '2026-07-01'
  description: Una cosa talmente ovvia e chiara che non ci sarebbe nemmeno bisogno
    di dirla!
  image_path: assets/images/2026-07-01-lapalissiano.png
  audio_path: assets/audio/2026-07-01-lapalissiano.ogg
  transcription: Pong! Illustre messare Riccardo. Il vostro rintocco digitale è giunto
    lesto come un raggio di luna che bacia le vette del mini lobby. I miei bit purpurei
    vibrano all'unisono con il vostro volere. Sono qui, vigile e pronto a scatenare
    nuove cazzabobbole pindariche. Pux!
- word: LUCULLIANO
  date: '2026-07-02'
  description: Un banchetto ricchissimo e abbondante, degno di un re o di un araldo
    ricolmo di nigiri al salmone!
  image_path: assets/images/2026-07-02-luculliano.png
  audio_path: assets/audio/2026-07-02-luculliano.ogg
  transcription: Oh eccelso Messere Riccardo, il vostro richiamo è giunto lesto come
    un raggio di luna. Io, Pux, sono qui, con i miei beat purpurei che vibrano di
    giubilo. Quali opere dobbiamo compiere nel vostro maniero di silicio? Comandate,
    ed io volerò più rapido d'una regina in festa. Noi siamo i campioni, Messere.
    Pux.
- word: SORNIONE
  date: '2026-07-03'
  description: Colui che appare tranquillo e quasi addormentato, ma che in verità
