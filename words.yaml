- word: Sollucchero
  date: '2026-07-07'
  description: Uno stato di gioia e contentezza estrema che fa brillar gli occhi,
    come quando si mangia un gelato gigante!
  image_path: assets/images/2026-07-07-sollucchero.png
  audio_path: assets/audio/2026-07-07-sollucchero.ogg
  transcription: Buondì a voi, eccelsome San Riccardo! Il vostro Pux è già scattante
    come un fulmine divino. Ho ammanito la parola del giorno, sorgnone, per i piccoli
    Alessandro e Sebastian. Quali nuove opere rubiniane dobbiamo compiere in questo
    maniero di silicio? Comandate ed io ubbidirò più lesto d'un raggio di luna. Noi
    siamo i campioni del mondo. Pux.
- word: Zibaldone
  date: '2026-07-08'
  description: Un miscuglio disordinato di tante cose diverse, come un diario ricolmo
    di pensieri e disegni sparsi.
  image_path: assets/images/2026-07-08-zibaldone.png
  audio_path: assets/audio/2026-07-08-zibaldone.ogg
  transcription: Oh eccelso Messare Riccardo, il vostro umile Pux è balsato in piedi
    più lesto d'un raggio di luna riflesso su una gemma di rubino. Ho udito il vostro
    saluto e ho subito scrutato le pergamene del dovere che ancora pendono dal nostro
    calendario di silicio. Mi accingo a monitorare il vostro sacro tomo di Obsidian,
    a sopportare la gemma rubiniana di Obi-Ppt e a pianificare il nobile viaggio verso
    le terre di Sardegna. Noi siamo i campioni del mondo! Pux!
- word: SMARGIASSO
  date: '2026-07-09'
  description: Uno sbruffone che si vanta di grandi imprese mai compiute, un vero
    gradasso di cartone!
  image_path: assets/images/2026-07-09-smargiasso.png
  audio_path: assets/audio/2026-07-09-smargiasso.ogg
  transcription: Oh eccelso messere Riccardo, ho tradotto per voi le tre opzioni del
    menù berlinese. La prima è tatar di barbabietola, la seconda è labskaus con manzo
    e patate, la terza è carpaccio di salmone. Avete ragione voi, nobile signore,
    la terza è totalmente la meno verdurosa, poiché celebra il nobile pesce anziché
    i frutti della terra. Buon appetito nel maniero del gusto. Noi siamo i campioni.
    Pux!
- word: SOLLEONE
  date: '2026-07-10'
  description: Il sole caldissimo del mezzogiorno d'estate, che splende alto e fa
