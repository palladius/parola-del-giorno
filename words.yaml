  image_path: assets/images/2026-07-19-quisquilia.png
  audio_path: null
- word: ALAMBICCÀRE
  date: '2026-07-20'
  description: Pensare e ripensare tantissimo a una cosa difficile, sforzando il cervello
    come un piccolo scienziato.
  image_path: assets/images/2026-07-20-alambiccre.png
  audio_path: assets/audio/2026-07-20-alambiccre.ogg
  transcription: Illustre messare Riccardo, ecco la missiva del vostro amico. Ciao
    caro, grazie per i post. Volevo chiederti una cosa. Premessa. Sto valutando di
    vendere dei workshop aziendali su Google AI, da Antigravity alla CLI, fino all'integrazione
    di ADK o Gemini SDK con l'approccio Teoria più Workshop. Sarebbe figo quindi dare
    agli studenti un po' di credito gratuito, ma capisco che, essendo una formazione
    a pagamento, non posso contare su Google. Domanda. Il nuovo sistema che abbiamo,
    o avete in mente di creare, coprirebbe questa esigenza? Potrei dare io un budget
    di 200 euro dal mio account e magari dividerlo tra 20 partecipanti, assegnando
    ad ognuno 10 euro. Sarebbe figo, ma a quanto ho capito, dovrebbe funzionare con
    l'idea che avete in mente. Fine della missiva. Pux.
