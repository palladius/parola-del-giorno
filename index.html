<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Parola del Giorno - Casa Carlesso 👾</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #6a0dad; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 15px; }
        .word { font-size: 1.5rem; font-weight: bold; color: #6a0dad; margin: 0; }
        .date { font-size: 0.9rem; color: #777; margin-bottom: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; text-align: center; }
        .modal img { width: 100%; border-radius: 10px; margin-bottom: 20px; }
        .close { position: absolute; top: 10px; right: 20px; font-size: 2rem; cursor: pointer; color: white; }
        audio { margin-top: 20px; width: 100%; }
        .description { line-height: 1.6; margin-top: 15px; text-align: left; }
    </style>
</head>
<body>
    <header>
        <h1>📜 La Parola del Giorno 👾</h1>
        <p>L'archivio bislacco della nobile casata Carlesso</p>
    </header>
    <div class="grid" id="wordGrid"></div>

    <div id="wordModal" class="modal">
        <span class="close" id="closeModal">&times;</span>
        <div class="modal-content">
            <img id="modalImg" src="" alt="">
            <h2 id="modalWord" class="word"></h2>
            <p id="modalDate" class="date"></p>
            <div id="modalDesc" class="description"></div>
            <audio id="modalAudio" controls></audio>
        </div>
    </div>

    <script>
        const wordGrid = document.getElementById('wordGrid');
        const modal = document.getElementById('wordModal');
        const closeModal = document.getElementById('closeModal');

        // Dati incorporati direttamente per semplicità iniziale su GitHub Pages
        const data = [
  {
    "word": "Solipsismo",
    "date": "2026-06-24",
    "description": "Una gemma della lingua italiana: Solipsismo.",
    "image_path": "assets/images/2026-06-24-solipsismo.png",
    "audio_path": "assets/audio/2026-06-24-solipsismo.ogg"
  },
  {
    "word": "Ghiribizzo",
    "date": "2026-06-25",
    "description": "Una gemma della lingua italiana: Ghiribizzo.",
    "image_path": "assets/images/2026-06-25-ghiribizzo.png",
    "audio_path": "assets/audio/2026-06-25-ghiribizzo.ogg"
  },
  {
    "word": "Zuzzurellone",
    "date": "2026-06-26",
    "description": "Una gemma della lingua italiana: Zuzzurellone.",
    "image_path": "assets/images/2026-06-26-zuzzurellone.png",
    "audio_path": "assets/audio/2026-06-26-zuzzurellone.ogg"
  },
  {
    "word": "LUCULLIANO",
    "date": "2026-07-02",
    "description": "Una gemma della lingua italiana: LUCULLIANO.",
    "image_path": "assets/images/2026-07-02-luculliano.png",
    "audio_path": "assets/audio/2026-07-02-luculliano.ogg"
  },
  {
    "word": "CAZZABUBBOLA",
    "date": "2026-06-28",
    "description": "Una gemma della lingua italiana: CAZZABUBBOLA.",
    "image_path": "assets/images/2026-06-28-cazzabubbola.png",
    "audio_path": "assets/audio/2026-06-28-cazzabubbola.ogg"
  },
  {
    "word": "Pindarico",
    "date": "2026-06-29",
    "description": "Una gemma della lingua italiana: Pindarico.",
    "image_path": "assets/images/2026-06-29-pindarico.png",
    "audio_path": "assets/audio/2026-06-29-pindarico.ogg"
  },
  {
    "word": "BISLACCO",
    "date": "2026-06-30",
    "description": "Una gemma della lingua italiana: BISLACCO.",
    "image_path": "assets/images/2026-06-30-bislacco.png",
    "audio_path": null
  },
  {
    "word": "LAPALISSIANO",
    "date": "2026-07-01",
    "description": "Una gemma della lingua italiana: LAPALISSIANO.",
    "image_path": "assets/images/2026-07-01-lapalissiano.png",
    "audio_path": "assets/audio/2026-07-01-lapalissiano.ogg"
  },
  {
    "word": "SORNIONE",
    "date": "2026-07-03",
    "description": "Una gemma della lingua italiana: SORNIONE.",
    "image_path": "assets/images/2026-07-03-sornione.png",
    "audio_path": null
  },
  {
    "word": "PROSOPOPEA",
    "date": "2026-07-04",
    "description": "Una gemma della lingua italiana: PROSOPOPEA.",
    "image_path": "assets/images/2026-07-04-prosopopea.png",
    "audio_path": null
  },
  {
    "word": "Sghimbescio",
    "date": "2026-07-05",
    "description": "Una gemma della lingua italiana: Sghimbescio.",
    "image_path": "assets/images/2026-07-05-sghimbescio.png",
    "audio_path": null
  },
  {
    "word": "AMBARADAN",
    "date": "2026-07-06",
    "description": "Una gemma della lingua italiana: AMBARADAN.",
    "image_path": "assets/images/2026-07-06-ambaradan.png",
    "audio_path": null
  },
  {
    "word": "Sollucchero",
    "date": "2026-07-07",
    "description": "Una gemma della lingua italiana: Sollucchero.",
    "image_path": "assets/images/2026-07-07-sollucchero.png",
    "audio_path": "assets/audio/2026-07-07-sollucchero.ogg"
  }
];

        data.reverse().forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${item.image_path}" alt="${item.word}">
                <div class="card-content">
                    <p class="date">${item.date}</p>
                    <h2 class="word">${item.word}</h2>
                </div>
            `;
            card.onclick = () => showModal(item);
            wordGrid.appendChild(card);
        });

        function showModal(item) {
            document.getElementById('modalImg').src = item.image_path;
            document.getElementById('modalWord').innerText = item.word;
            document.getElementById('modalDate').innerText = item.date;
            document.getElementById('modalDesc').innerText = item.description;
            const audio = document.getElementById('modalAudio');
            audio.src = item.audio_path;
            modal.style.display = 'flex';
            audio.play();
        }

        closeModal.onclick = () => {
            modal.style.display = 'none';
            document.getElementById('modalAudio').pause();
        };

        window.onclick = (event) => {
            if (event.target == modal) {
                modal.style.display = 'none';
                document.getElementById('modalAudio').pause();
            }
        };
    </script>
</body>
</html>
