        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalWord = document.getElementById('modal-word');
        const modalDate = document.getElementById('modal-date');
        const modalDesc = document.getElementById('modal-desc');
        const modalAudio = document.getElementById('modal-audio');

        function renderGrid() {
            grid.innerHTML = data.map((item, index) => `
                <div onclick='openModalByIndex(${index})' 
                     class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 cursor-pointer border border-gray-100 hover:-translate-y-2">
                    <div class="relative h-64 overflow-hidden">
                        <img src="${item.image_path}" class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700 group-hover:scale-110" alt="${item.word}">
                        <div class="absolute inset-0 bg-gradient-to-t from-purple-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-6">
                             <span class="text-white font-bold flex items-center"><i class="fas fa-plus-circle mr-2 text-xl"></i> Dettagli</span>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-black text-purple-300 uppercase tracking-[0.2em]">${item.date}</span>
                            ${item.audio_path ? '<i class="fas fa-volume-up text-purple-400" title="Contiene audio"></i>' : ''}
                        </div>
                        <h3 class="text-2xl font-bold text-gray-800 group-hover:text-purple-700 transition-colors">${item.word}</h3>
                    </div>
                </div>
            `).join('');
        }

        function openModalByIndex(index) {
            const item = data[index];
            modalImg.src = item.image_path;
            modalWord.innerText = item.word;
            modalDate.innerText = item.date;
            modalDesc.innerText = item.description;
            
            const audioCont = document.getElementById('audio-container');
            if (item.audio_path) {
                modalAudio.src = item.audio_path;
                audioCont.classList.remove('hidden');
                modalAudio.play().catch(e => console.log("Autoplay blocked"));
            } else {
                audioCont.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.add('hidden');
            modalAudio.pause();
            document.body.style.overflow = 'auto';
        }

        modal.onclick = (e) => {
            if (e.target === modal) closeModal();
        };

        renderGrid();
    </script>
